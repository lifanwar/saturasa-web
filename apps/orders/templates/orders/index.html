<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Restoran</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-base-100" x-data="menuApp()">
    <!-- Hero Section -->
    <div class="hero bg-gradient-to-r from-green-200 to-green-300 py-16">
        <div class="hero-content flex-col lg:flex-row-reverse max-w-6xl">
            <div class="flex-1 flex justify-center">
                <div class="text-6xl">🍱</div>
            </div>
            <div class="flex-1 text-left">
                <h1 class="text-5xl font-bold text-green-800 mb-4">All Best recipes in one place</h1>
                <p class="text-green-700 mb-6">Upload your own home-made recipe and share it with the community</p>
                <button class="btn bg-green-600 hover:bg-green-700 text-white border-none">Order now 📦</button>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Best Sellers Section -->
        <div class="mb-12">
            <!-- Carousel for Mobile & Desktop centered -->
            <div class="flex gap-4 overflow-x-auto pb-4 snap-x snap-mandatory lg:justify-center px-4">
                <template x-for="(item, index) in bestSellers" :key="index">
                    <div class="flex-shrink-0 w-72 sm:w-80 snap-center">
                        <div class="bg-base-200 rounded-3xl p-4 shadow-md relative">
                            <!-- Badge Terlaris -->
                            <div x-show="item.isBestSeller" class="absolute top-3 right-3 z-10 badge badge-warning gap-1 px-3 py-2 text-xs font-semibold">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                </svg>
                                Terlaris
                            </div>
                            <!-- Image -->
                            <div class="mb-3">
                                <img :src="item.img" :alt="item.name" class="w-full h-48 object-cover rounded-2xl" />
                            </div>
                            <!-- Content -->
                            <div class="px-1">
                                <h3 class="font-bold text-lg mb-1" x-text="item.name"></h3>
                                <p class="text-sm text-base-content/70 mb-3" x-text="item.desc"></p>
                                <div class="flex justify-between items-center">
                                    <span class="text-xl font-bold" x-text="'$' + item.price"></span>
                                    <button @click="addToCart(item.name, item.price)" class="btn btn-circle btn-sm bg-green-600 hover:bg-green-700 text-white border-0">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Floating Cart Bubble Button -->
        <div x-show="cart.length > 0" class="fixed bottom-20 right-6 z-50 sm:bottom-6">
            <!-- Cart Bubble Button -->
            <button @click="showCart = !showCart" class="btn btn-circle btn-lg bg-green-600 hover:bg-green-700 border-0 shadow-2xl relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="badge badge-sm badge-error absolute -top-2 -right-2" x-text="totalItems"></span>
            </button>
            
            <!-- Cart Detail Bubble -->
            <div x-show="showCart" 
                 @click.away="showCart = false"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-90"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-90"
                 class="absolute bottom-20 right-0 w-80 bg-base-100 rounded-2xl shadow-2xl p-4 border border-base-300">
                
                <!-- Header -->
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-base-300">
                    <h3 class="font-bold text-lg">🛒 Pesanan Anda</h3>
                    <button @click="showCart = false" class="btn btn-circle btn-ghost btn-xs">✕</button>
                </div>
                
                <!-- Cart Items - Scrollable -->
                <div class="space-y-2 max-h-60 overflow-y-auto mb-3">
                    <template x-for="(item, index) in cart" :key="index">
                        <div class="bg-base-200 p-3 rounded-lg">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex-1">
                                    <p class="font-medium text-sm" x-text="item.name"></p>
                                    <p class="text-xs text-base-content/60" x-text="'$' + item.price + ' x ' + item.quantity"></p>
                                </div>
                                <button @click="removeFromCart(index)" class="btn btn-circle btn-xs btn-ghost text-error">×</button>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="join">
                                    <button @click="decreaseQuantity(index)" class="btn btn-xs join-item">-</button>
                                    <button class="btn btn-xs join-item no-animation" x-text="item.quantity"></button>
                                    <button @click="increaseQuantity(index)" class="btn btn-xs join-item">+</button>
                                </div>
                                <span class="font-semibold text-sm" x-text="'$' + (item.price * item.quantity)"></span>
                            </div>
                        </div>
                    </template>
                </div>
                
                <!-- Total -->
                <div class="pt-3 border-t border-base-300">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold">Total:</span>
                        <span class="font-bold text-lg text-green-600" x-text="'$' + totalPrice"></span>
                    </div>
                    <button class="btn btn-block bg-green-600 hover:bg-green-700 text-white border-0 btn-sm">
                        Checkout
                    </button>
                </div>
            </div>
        </div>

        <!-- Categories Section -->
        <div class="mb-8">
            <h3 class="text-2xl font-bold mb-6 text-base-content">Browse Menu</h3>
            <div class="flex gap-3 overflow-x-auto pb-4 lg:justify-center" style="-ms-overflow-style: none; scrollbar-width: none;">
                <button 
                    @click="filterCategory = 'all'; subCategory = 'all'" 
                    class="btn btn-sm flex-shrink-0 transition-all duration-300 border-2"
                    :class="filterCategory === 'all' ? 'bg-green-600 hover:bg-green-700 text-white border-green-600' : 'btn-outline border-base-300 hover:border-green-600 hover:bg-green-50'">
                    All Menu
                </button>
                <button 
                    @click="filterCategory = 'makanan'; subCategory = 'all'" 
                    class="btn btn-sm flex-shrink-0 transition-all duration-300 border-2"
                    :class="filterCategory === 'makanan' ? 'bg-green-600 hover:bg-green-700 text-white border-green-600' : 'btn-outline border-base-300 hover:border-green-600 hover:bg-green-50'">
                    Food
                </button>
                <button 
                    @click="filterCategory = 'minuman'; subCategory = 'all'" 
                    class="btn btn-sm flex-shrink-0 transition-all duration-300 border-2"
                    :class="filterCategory === 'minuman' ? 'bg-green-600 hover:bg-green-700 text-white border-green-600' : 'btn-outline border-base-300 hover:border-green-600 hover:bg-green-50'">
                    Drinks
                </button>
                <button 
                    class="btn btn-sm btn-outline flex-shrink-0 border-2 border-base-300 hover:border-green-600 hover:bg-green-50 transition-all duration-300">
                    Desserts
                </button>
                <button 
                    class="btn btn-sm btn-outline flex-shrink-0 border-2 border-base-300 hover:border-green-600 hover:bg-green-50 transition-all duration-300">
                    Appetizers
                </button>
                <button 
                    class="btn btn-sm btn-outline flex-shrink-0 border-2 border-base-300 hover:border-green-600 hover:bg-green-50 transition-all duration-300">
                    Main Course
                </button>
                <button 
                    class="btn btn-sm btn-outline flex-shrink-0 border-2 border-base-300 hover:border-green-600 hover:bg-green-50 transition-all duration-300">
                    Specials
                </button>
            </div>
        </div>

        <!-- Makanan Section -->
        <div x-show="filterCategory === 'all' || filterCategory === 'makanan'" class="mb-12">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <template x-for="(item, index) in foods" :key="index">
                    <div class="card shadow-lg hover:shadow-xl transition-shadow border-0" :class="'bg-' + ['primary/5', 'warning/10', 'success/10'][index % 3]">
                        <figure class="px-6 pt-6">
                            <img :src="item.img" :alt="item.name" class="w-full h-40 object-cover rounded-xl" />
                        </figure>
                        <div class="card-body p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="card-title text-lg font-bold" x-text="item.name"></h3>
                                <button class="btn btn-sm btn-circle btn-ghost text-error">❤️</button>
                            </div>
                            <p class="text-sm text-base-content/70 mb-3" x-text="item.desc"></p>
                            <div class="flex justify-between items-center">
                                <span class="text-xl font-bold" x-text="'$' + item.price"></span>
                                <button @click="addToCart(item.name, item.price)" class="btn btn-circle btn-sm bg-green-600 hover:bg-green-700 text-white border-0">+</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Minuman Section -->
        <div x-show="filterCategory === 'all' || filterCategory === 'minuman'" class="mb-12">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <template x-for="(item, index) in drinks" :key="index">
                    <div class="card shadow-lg hover:shadow-xl transition-shadow border-0" :class="'bg-' + ['info/10', 'secondary/10', 'accent/10'][index % 3]">
                        <figure class="px-6 pt-6">
                            <img :src="item.img" :alt="item.name" class="w-full h-40 object-cover rounded-xl" />
                        </figure>
                        <div class="card-body p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="card-title text-lg font-bold" x-text="item.name"></h3>
                                <button class="btn btn-sm btn-circle btn-ghost text-error">❤️</button>
                            </div>
                            <p class="text-sm text-base-content/70 mb-3" x-text="item.desc"></p>
                            <div class="flex justify-between items-center">
                                <span class="text-xl font-bold" x-text="'$' + item.price"></span>
                                <button @click="addToCart(item.name, item.price)" class="btn btn-circle btn-sm bg-green-600 hover:bg-green-700 text-white border-0">+</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer footer-center bg-green-100 py-8">
        <div>
            <p class="font-bold text-lg text-green-800">Menu Restoran</p>
            <p class="text-green-700 text-sm">Sajian terbaik untuk Anda dan keluarga</p>
            <p class="text-xs text-green-600 mt-2">© 2024 Menu Restoran. All rights reserved.</p>
        </div>
    </footer>

    <style>
        /* Hide scrollbar for all carousel and category sections */
        .overflow-x-auto::-webkit-scrollbar {
            display: none;
        }
        
        .overflow-x-auto {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script>
        function menuApp() {
            return {
                cart: [],
                showCart: false,
                filterCategory: 'all',
                subCategory: 'all',
                
                bestSellers: [
                    { name: 'Pappardelle', desc: 'With Vegetable', price: 35, img: 'https://picsum.photos/300/300?random=1', isBestSeller: true },
                    { name: 'Ravioli Stuffed', desc: 'With Pesto Sauce', price: 35, img: 'https://picsum.photos/300/300?random=2', isBestSeller: true },
                    { name: 'Chicken Bowl', desc: 'With Fresh Salad', price: 28, img: 'https://picsum.photos/300/300?random=3', isBestSeller: true }
                ],
                
                foods: [
                    { name: 'Seafood Pasta', desc: 'Fresh seafood with creamy pasta and herbs', price: 42, img: 'https://picsum.photos/300/200?random=5', category: 'makanan' },
                    { name: 'Beef Rendang', desc: 'Traditional Indonesian slow-cooked beef curry', price: 48, img: 'https://picsum.photos/300/200?random=7', category: 'makanan' },
                    { name: 'Healthy Bowl', desc: 'Fresh vegetables with quinoa and nuts', price: 28, img: 'https://picsum.photos/300/200?random=8', category: 'makanan' }
                ],
                
                drinks: [
                    { name: 'Fresh Orange Juice', desc: '100% fresh orange juice with no preservatives', price: 18, img: 'https://picsum.photos/300/200?random=12', category: 'minuman' },
                    { name: 'Coffee Latte', desc: 'Rich espresso with steamed milk and foam art', price: 22, img: 'https://picsum.photos/300/200?random=14', category: 'minuman' },
                    { name: 'Berry Smoothie', desc: 'Mixed berries with yogurt and honey', price: 25, img: 'https://picsum.photos/300/200?random=17', category: 'minuman' }
                ],
                
                addToCart(name, price) {
                    const existingItem = this.cart.find(item => item.name === name);
                    if (existingItem) {
                        existingItem.quantity += 1;
                    } else {
                        this.cart.push({ name, price, quantity: 1 });
                    }
                    this.showCart = false;
                },
                
                removeFromCart(index) {
                    this.cart.splice(index, 1);
                    if (this.cart.length === 0) {
                        this.showCart = false;
                    }
                },
                
                increaseQuantity(index) {
                    this.cart[index].quantity += 1;
                },
                
                decreaseQuantity(index) {
                    if (this.cart[index].quantity > 1) {
                        this.cart[index].quantity -= 1;
                    } else {
                        this.removeFromCart(index);
                    }
                },
                
                get totalPrice() {
                    return this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                },
                
                get totalItems() {
                    return this.cart.reduce((sum, item) => sum + item.quantity, 0);
                }
            }
        }
    </script>
</body>
</html>
